project_id = "tracks"

[api]
enabled = true
port = 54821
# `tracks` must also be listed in Settings -> API -> Exposed schemas on the
# cloud project, or PostgREST returns 404 for every table.
schemas = ["public", "graphql_public", "tracks"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54822
shadow_port = 54820
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54823
api_url = "http://127.0.0.1:54821"

[inbucket]
enabled = true
port = 54824

[storage]
enabled = true
file_size_limit = "50MiB"

# Scanned LDC endorsements, mayor's approval, council resolutions.
[storage.buckets.tracks-documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54821/auth/v1/callback"
skip_nonce_check = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
